<!doctype html>
<html lang="ja" data-theme="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efdf">
  <meta name="description" content="ringobouyaの個人サイト。テーマを切り替えて、画面の色を楽しめます。">
  <title>RBLAB 98</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3efdf;
      --paper-deep: #e7e0cb;
      --ink: #23352d;
      --muted: #5e6d62;
      --panel: #fffdf5;
      --panel-shadow: #d9d1ba;
      --line: #536b57;
      --accent: #bd5639;
      --accent-ink: #fffaf0;
      --game-sky: #142042;
      --game-glow: #ffdb75;
      --game-mountain: #484a76;
      --game-ground: #252b4b;
      --game-accent: #f18a75;
      --game-star: #fff0c5;
      --dot: rgba(35, 53, 45, .075);
      --shadow: 6px 6px 0 var(--panel-shadow);
      --radius: 4px;
    }

    html[data-theme="terminal"] {
      color-scheme: dark;
      --paper: #17201c;
      --paper-deep: #26332b;
      --ink: #e7f0d6;
      --muted: #bac8a9;
      --panel: #202c25;
      --panel-shadow: #101612;
      --line: #8ca77b;
      --accent: #b8da70;
      --accent-ink: #17201c;
      --game-sky: #071d1b;
      --game-glow: #c6e879;
      --game-mountain: #185047;
      --game-ground: #0d302b;
      --game-accent: #59c9a2;
      --game-star: #d7f6a0;
      --dot: rgba(231, 240, 214, .08);
    }

    html[data-theme="candy"] {
      --paper: #f8e8e8;
      --paper-deep: #efd2d8;
      --ink: #452b43;
      --muted: #73516c;
      --panel: #fff8f5;
      --panel-shadow: #dfbfc9;
      --line: #815174;
      --accent: #ad477e;
      --accent-ink: #fff8f5;
      --game-sky: #40325f;
      --game-glow: #ffdf8d;
      --game-mountain: #9c5488;
      --game-ground: #58376e;
      --game-accent: #96ddeb;
      --game-star: #ffe9f5;
      --dot: rgba(69, 43, 67, .08);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(var(--dot) .8px, transparent .8px);
      background-size: 14px 14px;
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      line-height: 1.65;
      transition: color .2s ease, background-color .2s ease;
    }

    button { font: inherit; }

    a { color: inherit; }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }

    .page-shell {
      width: min(100% - 40px, 1120px);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      font-size: .78rem;
      letter-spacing: .06em;
    }

    .brand-mark { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; }

    .pixel-mark {
      display: inline-block;
      width: 15px;
      height: 15px;
      background: var(--accent);
      box-shadow: 5px 0 var(--accent), 0 5px var(--accent), 5px 5px var(--accent), 10px 5px var(--accent), 5px 10px var(--accent);
      transform: scale(.66);
      transform-origin: left center;
    }

    .topbar-note { color: var(--muted); }

    main { padding: 70px 0 54px; }

    .intro-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(290px, .82fr);
      align-items: center;
      gap: clamp(32px, 7vw, 92px);
    }

    .eyebrow, .section-label, .window-label, .status {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: .09em;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 18px;
      color: var(--muted);
      font-size: .75rem;
    }

    .eyebrow::before { width: 7px; height: 7px; content: ""; background: var(--accent); }

    h1 {
      max-width: 640px;
      margin: 0;
      font-size: clamp(3.1rem, 8vw, 6.9rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 900;
    }

    h1 span { display: block; color: var(--accent); }

    .lead {
      max-width: 420px;
      margin: 25px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 1.5vw, 1.15rem);
    }

    .scene-wrap { position: relative; padding: 0 0 18px 18px; }

    .scene-wrap::before {
      position: absolute;
      z-index: -1;
      inset: 18px 0 0 0;
      border: 1px solid var(--line);
      content: "";
    }

    .window {
      overflow: hidden;
      border: 1px solid var(--line);
      padding: 9px;
      background: var(--paper-deep);
      box-shadow: var(--shadow);
    }

    .window-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 31px;
      padding: 0 3px 8px;
    }

    .window-label { font-size: .65rem; font-weight: 700; }

    .window-controls { display: flex; gap: 5px; }

    .window-controls i { display: block; width: 8px; height: 8px; border: 1px solid var(--line); background: var(--panel); }

    .screen {
      position: relative;
      display: grid;
      min-height: 278px;
      overflow: hidden;
      align-content: start;
      background: var(--game-sky);
      color: var(--game-star);
    }

    .screen::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: repeating-linear-gradient(to bottom, transparent 0 3px, rgba(0, 0, 0, .13) 4px);
      content: "";
      pointer-events: none;
    }

    .pixel-world { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }

    .game-title {
      position: absolute;
      z-index: 2;
      top: 17%;
      right: 0;
      left: 0;
      display: grid;
      justify-items: center;
      color: var(--game-star);
      text-align: center;
      text-shadow: 2px 2px 0 #17152b, 4px 4px 0 rgba(0, 0, 0, .4);
    }

    .game-title strong {
      font-family: "Arial Black", "Yu Gothic", sans-serif;
      font-size: clamp(1.2rem, 2.6vw, 1.85rem);
      font-weight: 900;
      letter-spacing: .14em;
      -webkit-text-stroke: 1px var(--game-accent);
    }

    .game-title small {
      margin-top: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .56rem;
      letter-spacing: .2em;
    }

    .screen-caption {
      position: absolute;
      z-index: 2;
      right: 12px;
      bottom: 10px;
      left: 12px;
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .62rem;
      letter-spacing: .06em;
    }

    .theme-section {
      display: grid;
      grid-template-columns: minmax(160px, .7fr) 1.3fr;
      align-items: center;
      gap: 28px;
      margin-top: 80px;
      padding: 25px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .section-label { margin: 0; font-size: .7rem; color: var(--muted); }

    .theme-heading { margin: 3px 0 0; font-size: 1.15rem; letter-spacing: -.03em; }

    .theme-controls { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 9px; }

    .theme-button {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 43px;
      padding: 7px 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font-size: .82rem;
      transition: background-color .2s ease, color .2s ease, transform .2s ease;
    }

    .theme-button:hover { transform: translateY(-2px); }

    .theme-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
      box-shadow: 3px 3px 0 var(--panel-shadow);
    }

    .swatch { width: 13px; height: 13px; border: 1px solid currentColor; border-radius: 50%; }
    [data-theme-choice="classic"] .swatch { background: #dce5d2; }
    [data-theme-choice="terminal"] .swatch { background: #17201c; }
    [data-theme-choice="candy"] .swatch { background: #f4c2d4; }

    .below-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 24px;
      padding: 22px 0 0;
    }

    .note { max-width: 560px; margin: 0; color: var(--muted); font-size: .87rem; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      color: var(--muted);
      font-size: .66rem;
      white-space: nowrap;
    }

    .status::before { width: 7px; height: 7px; border-radius: 50%; background: #698d55; content: ""; }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 62px;
      padding: 15px 0 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: .65rem;
      letter-spacing: .04em;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      text-decoration: none;
    }

    .github-link:hover { color: var(--accent); }

    .github-avatar {
      width: 26px;
      height: 26px;
      border: 1px solid var(--line);
      border-radius: 3px;
      object-fit: cover;
      image-rendering: pixelated;
    }

    @media (max-width: 760px) {
      .page-shell { width: min(100% - 32px, 560px); }
      main { padding-top: 48px; }
      .intro-grid { grid-template-columns: 1fr; gap: 36px; }
      h1 { font-size: clamp(3.3rem, 16vw, 5.7rem); }
      .scene-wrap { width: min(100%, 440px); margin-left: auto; }
      .theme-section { grid-template-columns: 1fr; gap: 16px; margin-top: 58px; }
      .theme-controls { justify-content: flex-start; }
      .below-grid { grid-template-columns: 1fr; gap: 12px; }
      .status { white-space: normal; }
    }

    @media (max-width: 420px) {
      .topbar-note { max-width: 130px; text-align: right; }
      .theme-controls { display: grid; grid-template-columns: 1fr; }
      .theme-button { justify-content: flex-start; }
      .screen { min-height: 240px; }
      footer { flex-direction: column; gap: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand-mark"><span class="pixel-mark" aria-hidden="true"></span><span>RBLAB 98</span></div>
      <div class="topbar-note">PERSONAL HOMEPAGE</div>
    </header>

    <main>
      <section class="intro-grid" aria-labelledby="page-title">
        <div class="intro-copy">
          <p class="eyebrow">WELCOME</p>
          <h1 id="page-title">RBLAB 98</h1>
          <p class="lead">まだ何もないので、とりあえず色だけ変えられるようにしました。</p>
        </div>

        <div class="scene-wrap" role="img" aria-label="PC-98風のゲームタイトル画面をイメージしたドット絵の夕景">
          <div class="window">
            <div class="window-bar">
              <span class="window-label">RBLAB 98 / MENU</span>
              <span class="window-controls" aria-hidden="true"><i></i><i></i><i></i></span>
            </div>
            <div class="screen" aria-hidden="true">
              <svg class="pixel-world" viewBox="0 0 480 320" preserveAspectRatio="xMidYMid slice" focusable="false">
                <rect width="480" height="320" fill="var(--game-sky)" />
                <g fill="var(--game-star)">
                  <rect x="38" y="34" width="4" height="4"/><rect x="92" y="76" width="3" height="3"/>
                  <rect x="146" y="42" width="4" height="4"/><rect x="212" y="82" width="3" height="3"/>
                  <rect x="272" y="38" width="3" height="3"/><rect x="424" y="43" width="4" height="4"/>
                  <rect x="395" y="113" width="3" height="3"/><rect x="61" y="127" width="3" height="3"/>
                </g>
                <g fill="var(--game-glow)">
                  <rect x="345" y="62" width="36" height="8"/><rect x="337" y="70" width="52" height="8"/>
                  <rect x="329" y="78" width="68" height="36"/><rect x="337" y="114" width="52" height="8"/>
                  <rect x="345" y="122" width="36" height="8"/>
                </g>
                <g fill="var(--game-mountain)">
                  <path d="M0 205h48v-12h24v-12h16v12h32v20h20v-20h20v-12h12v-12h16v12h16v20h32v20H0z"/>
                  <path d="M194 221h18v-18h18v-14h16v-12h16v12h20v18h18v14h22v20H194z"/>
                </g>
                <path d="M0 232h480v88H0z" fill="var(--game-ground)"/>
                <g fill="var(--game-accent)">
                  <rect x="34" y="245" width="26" height="22"/><rect x="40" y="233" width="14" height="12"/>
                  <rect x="72" y="252" width="34" height="15"/><rect x="82" y="238" width="14" height="14"/>
                  <rect x="366" y="247" width="28" height="20"/><rect x="374" y="235" width="12" height="12"/>
                  <rect x="410" y="251" width="35" height="16"/><rect x="421" y="237" width="13" height="14"/>
                </g>
                <g fill="var(--game-glow)">
                  <rect x="43" y="251" width="4" height="5"/><rect x="53" y="251" width="4" height="5"/>
                  <rect x="82" y="257" width="4" height="5"/><rect x="92" y="257" width="4" height="5"/>
                  <rect x="375" y="253" width="4" height="5"/><rect x="385" y="253" width="4" height="5"/>
                  <rect x="422" y="257" width="4" height="5"/><rect x="433" y="257" width="4" height="5"/>
                </g>
                <path d="M0 284h480M0 300h480" stroke="var(--game-accent)" stroke-width="2" opacity=".55"/>
              </svg>
              <div class="game-title"><strong>RBLAB 98</strong><small>COLOR MODE SELECT</small></div>
              <div class="screen-caption"><span>PC-98 STYLE</span><span>3 COLOR MODES</span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="theme-section" aria-labelledby="theme-heading">
        <div>
          <p class="section-label">表示設定</p>
          <h2 class="theme-heading" id="theme-heading">*</h2>
        </div>
        <div class="theme-controls" role="group" aria-label="テーマを選択">
          <button class="theme-button" type="button" data-theme-choice="classic" aria-pressed="true"><span class="swatch" aria-hidden="true"></span>クラシック</button>
          <button class="theme-button" type="button" data-theme-choice="terminal" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>ターミナル</button>
          <button class="theme-button" type="button" data-theme-choice="candy" aria-pressed="false"><span class="swatch" aria-hidden="true"></span>キャンディ</button>
        </div>
      </section>

      <div class="below-grid">
        <p class="note">選んだテーマは、このブラウザーに保存されます。</p>
        <p class="status" id="theme-status" aria-live="polite">現在のテーマ：クラシック</p>
      </div>
    </main>

    <footer>
      <span>RBLAB 98</span>
      <a class="github-link" href="https://github.com/ringobouya" target="_blank" rel="noopener noreferrer">
        <img class="github-avatar" src="assets/github-avatar.png" width="26" height="26" alt="" loading="lazy">
        <span>GitHub: ringobouya ↗</span>
      </a>
    </footer>
  </div>

  <script>
    (() => {
      const root = document.documentElement;
      const buttons = Array.from(document.querySelectorAll("[data-theme-choice]"));
      const status = document.getElementById("theme-status");
      const themeNames = {
        classic: "クラシック",
        terminal: "ターミナル",
        candy: "キャンディ"
      };
      const storageKey = "web-lab-theme";

      function applyTheme(theme, persist = true) {
        const selectedTheme = Object.hasOwn(themeNames, theme) ? theme : "classic";
        root.dataset.theme = selectedTheme;
        buttons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.themeChoice === selectedTheme));
        });
        status.textContent = `現在のテーマ：${themeNames[selectedTheme]}`;
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).getPropertyValue("--paper").trim();

        if (persist) {
          try {
            localStorage.setItem(storageKey, selectedTheme);
          } catch (_error) {
            // 保存できない環境でも、ページ内のテーマ切替は利用できます。
          }
        }
      }

      let initialTheme = "classic";
      try {
        const savedTheme = localStorage.getItem(storageKey);
        if (Object.hasOwn(themeNames, savedTheme)) initialTheme = savedTheme;
      } catch (_error) {
        // 初期テーマのまま表示します。
      }

      applyTheme(initialTheme, false);
      buttons.forEach((button) => {
        button.addEventListener("click", () => applyTheme(button.dataset.themeChoice));
      });
    })();
  </script>
</body>
</html>
